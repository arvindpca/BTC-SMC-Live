name: BTC-SMC Live Trading (CoinDCX BTC-USDT futures, INR margin)

# One job loops for ~5h40m, scanning after every 5-minute candle, then dispatches its own successor
# (which waits in the concurrency queue).  GitHub's cron is best-effort, so it is only a safety net
# that restarts the chain if it ever breaks.
#
# LIVE_MODE (variable or secret): OFF (default) | DRY_RUN | LIVE (+ LIVE_CONFIRM=YES_TRADE_REAL_MONEY).
# Set LIVE_MODE=OFF to stop: the current job ends at its next cycle boundary only when its time is up,
# so to stop immediately use "Cancel workflow" on the running job.  Open positions keep their
# exchange-side SL/TP either way.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/live-trading.yml"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: write   # only used to dispatch the next run

concurrency:
  group: btc-smc-live
  cancel-in-progress: false

jobs:
  # Safety hardening proposed in this PR: do not execute real-money trading.
  # This disables future runs of this job if the PR is reviewed and merged.
  trade:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LIVE_MODE: ${{ vars.LIVE_MODE || secrets.LIVE_MODE || 'OFF' }}
      LIVE_CONFIRM: ${{ vars.LIVE_CONFIRM || secrets.LIVE_CONFIRM }}
      COINDCX_FUTURES_PAIR: B-BTC_USDT  # locked; the bot refuses any other pair
      COINDCX_MARGIN_CURRENCY: INR
      MARGIN_INR: ${{ vars.MARGIN_INR || secrets.MARGIN_INR || '300' }}
      LEVERAGE: ${{ vars.LEVERAGE || secrets.LEVERAGE || '30' }}
      MAX_TRADES_PER_DAY: ${{ vars.MAX_TRADES_PER_DAY || secrets.MAX_TRADES_PER_DAY || '3' }}
      LOOP_MINUTES: "340"
      COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
      COINDCX_API_SECRET: ${{ secrets.COINDCX_API_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore duplicate-signal / open-trade state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: live-state-${{ github.run_id }}
          restore-keys: live-state-
      - name: Trading loop (scans every 5-minute candle)
        id: loop
        run: python -m app.live_loop
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: live-state-${{ github.run_id }}
      - name: Start the next run (waits in queue until this one ends)
        if: ${{ success() && steps.loop.outputs.continue == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live-trading.yml --repo "${{ github.repository }}" --ref main
