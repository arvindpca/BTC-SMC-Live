name: BTC-SMC Live Trading (CoinDCX INR futures)

# SAFETY LOCK: this hosted workflow is intentionally disabled for exchange orders.
# GitHub Actions schedules are best-effort and are not a 24/7 execution guarantee.
# Do not remove this lock until all safety blockers have been fixed and reviewed.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: btc-smc-live
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      LIVE_MODE: OFF
      LIVE_CONFIRM: ""
      COINDCX_FUTURES_PAIR: B-BTC_USDT
      COINDCX_MARGIN_CURRENCY: INR
      MARGIN_INR: "300"
      LEVERAGE: "30"
      MAX_TRADES_PER_DAY: "3"
      COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
      COINDCX_API_SECRET: ${{ secrets.COINDCX_API_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare state directory
        run: mkdir -p state
      - name: Restore duplicate-signal guard
        uses: actions/cache/restore@v4
        with:
          path: state
          key: live-state-${{ github.run_id }}
          restore-keys: live-state-
      - name: Run one trading cycle (hard-locked OFF)
        run: python -m app.live_runner
      - name: Save duplicate-signal guard
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: live-state-${{ github.run_id }}
