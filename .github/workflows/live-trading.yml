name: BTC-SMC Live Trading (CoinDCX INR futures)

# Scheduled Actions are best-effort, not a 24/7 execution guarantee.
# Keep this workflow in OFF/DRY_RUN for paper validation; do not rely on
# runner-local state as the authoritative record of an exchange position.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: btc-smc-live
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      LIVE_MODE: ${{ vars.LIVE_MODE || secrets.LIVE_MODE || 'OFF' }}
      LIVE_CONFIRM: ${{ vars.LIVE_CONFIRM || secrets.LIVE_CONFIRM }}
      COINDCX_FUTURES_PAIR: B-BTC_USDT
      COINDCX_MARGIN_CURRENCY: INR
      MARGIN_INR: ${{ vars.MARGIN_INR || secrets.MARGIN_INR || '300' }}
      LEVERAGE: ${{ vars.LEVERAGE || secrets.LEVERAGE || '30' }}
      MAX_TRADES_PER_DAY: ${{ vars.MAX_TRADES_PER_DAY || secrets.MAX_TRADES_PER_DAY || '3' }}
      COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
      COINDCX_API_SECRET: ${{ secrets.COINDCX_API_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The cache action cannot save a path that does not exist. Create it
      # before restore/run so a state file written by the runner can be cached.
      - name: Prepare state directory
        run: mkdir -p state
      - name: Restore duplicate-signal guard
        uses: actions/cache/restore@v4
        with:
          path: state
          key: live-state-${{ github.run_id }}
          restore-keys: live-state-
      - name: Run one trading cycle
        run: python -m app.live_runner
      - name: Save duplicate-signal guard
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: live-state-${{ github.run_id }}
