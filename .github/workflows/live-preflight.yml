import os
import sys

def run_preflight():
    print("RUNNING LIVE PREFLIGHT CHECK...")
    
    # 1. Check API Keys
    api_key = os.getenv("COINDCX_API_KEY")
    api_secret = os.getenv("COINDCX_API_SECRET")
    
    if not api_key:
        print("FAIL: COINDCX_API_KEY is missing")
        sys.exit(1)
    print("PASS/CHECK: COINDCX_API_KEY is present")
    
    if not api_secret:
        print("FAIL: COINDCX_API_SECRET is missing")
        sys.exit(1)
    print("PASS/CHECK: COINDCX_API_SECRET is present")
    
    # 2. Set defaults if missing from environment/secrets
    os.environ["COINDCX_FUTURES_INSTRUMENT"] = os.getenv("COINDCX_FUTURES_INSTRUMENT", "B-BTC_USDT")
    os.environ["COINDCX_MARGIN_CURRENCY"] = os.getenv("COINDCX_MARGIN_CURRENCY", "INR")
    
    print(f"PASS/CHECK: Instrument set to {os.getenv('COINDCX_FUTURES_INSTRUMENT')}")
    print(f"PASS/CHECK: Margin currency set to {os.getenv('COINDCX_MARGIN_CURRENCY')}")
    
    # 3. Telegram Check
    if os.getenv("TELEGRAM_BOT_TOKEN") and os.getenv("TELEGRAM_CHAT_ID"):
        print("PASS/CHECK: Telegram credentials present")
    else:
        print("WARNING: Telegram credentials missing")

    print("PREFLIGHT PASSED: Ready for Live Trading Execution.")
    sys.exit(0)

if __name__ == "__main__":
    run_preflight()
