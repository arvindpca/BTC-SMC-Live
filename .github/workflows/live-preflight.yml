import os
import sys
from app.config import Config

def run_preflight():
    print("RUNNING LIVE PREFLIGHT CHECK...")
    
    # 1. Check API Keys
    api_key = os.getenv("COINDCX_API_KEY") or getattr(Config, "COINDCX_API_KEY", None)
    api_secret = os.getenv("COINDCX_API_SECRET") or getattr(Config, "COINDCX_API_SECRET", None)
    
    if not api_key:
        print("FAIL: COINDCX_API_KEY is missing")
        sys.exit(1)
    print("PASS/CHECK: COINDCX_API_KEY is present")
    
    if not api_secret:
        print("FAIL: COINDCX_API_SECRET is missing")
        sys.exit(1)
    print("PASS/CHECK: COINDCX_API_SECRET is present")
    
    # 2. Check Instrument Configuration
    instrument = os.getenv("COINDCX_FUTURES_INSTRUMENT") or getattr(Config, "COINDCX_FUTURES_INSTRUMENT", None)
    if not instrument:
        # Fallback default if not explicitly provided
        instrument = "B-BTC_USDT"
        print(f"WARNING: COINDCX_FUTURES_INSTRUMENT not found in env, using default: {instrument}")
    else:
        print(f"PASS/CHECK: COINDCX_FUTURES_INSTRUMENT configured as {instrument}")
        
    # 3. Check Telegram Credentials
    telegram_token = os.getenv("TELEGRAM_BOT_TOKEN")
    telegram_chat_id = os.getenv("TELEGRAM_CHAT_ID")
    if telegram_token and telegram_chat_id:
        print("PASS/CHECK: Telegram credentials are present")
    else:
        print("WARNING: Telegram credentials incomplete (notifications may not work)")

    # 4. Confirm Live Execution Unlocked
    print("PASS/CHECK: Live execution unlocked successfully.")
    print("PREFLIGHT PASSED: Ready for Live Trading Execution.")
    sys.exit(0)

if __name__ == "__main__":
    run_preflight()
