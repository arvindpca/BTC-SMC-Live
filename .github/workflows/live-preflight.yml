name: Live Configuration Preflight (No Orders)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preflight check
        env:
          COINDCX_API_KEY: ${{ secrets.COINDCX_API_KEY }}
          COINDCX_API_SECRET: ${{ secrets.COINDCX_API_SECRET }}
          COINDCX_PROXY: ${{ secrets.COINDCX_PROXY }}
          COINDCX_FUTURES_INSTRUMENT: ${{ secrets.COINDCX_FUTURES_INSTRUMENT }}
          COINDCX_MARGIN_CURRENCY: ${{ secrets.COINDCX_MARGIN_CURRENCY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXECUTION_MODE: "LIVE"
        run: python -m app.live_preflight
