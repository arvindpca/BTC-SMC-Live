name: BTC-SMC Paper Trading

on:
  workflow_dispatch:
  schedule:
    # UTC schedule; can be delayed by GitHub. Not a 24/7 guarantee.
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: btc-smc-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAPER_ONLY: "true"
      EXECUTION_MODE: "PAPER"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Enforce paper-only mode
        run: python -m app.config --check-paper-only
      - name: Run one bounded paper cycle
        run: python -m app.paper_runner
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-smc-paper-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
